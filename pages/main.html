<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Import Bootstrap -->
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Import jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Import Bootstrap Popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Import CSS -->
    <link rel="stylesheet" href="/css/loader.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/hamburger.css" />
    <link rel="stylesheet" href="/css/timesheet.css" />
    <link rel="stylesheet" href="/css/user-area.css" />

    <!-- Import Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Import Scripts -->
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/service/user-service.js"></script>
    <script type="module" src="/js/implements/timesheet/timesheet.js"></script>
    <script type="module" src="/js/implements/auth/auth.js"></script>

    <!-- Favicon -->
    <link
      rel="icon"
      href="/assets/images/calendar-check-regular.svg"
      type="image/png"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>

  <body>
    <!-- Loader -->
    <div id="loadingSpinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Caricamento...</span>
      </div>
    </div>

    <!-- Content -->
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
      id="mainContent"
      style="display: none"
    >
      <div class="card login-card">
        <h3 class="mb-4">Log-in</h3>
        <form id="loginForm">
          <!-- Email -->
          <div class="form-group mb-4">
            <label for="email" class="mb-2">E-mail</label>
            <input
              type="text"
              class="form-control"
              id="email"
              placeholder="Inserisci l'email"
              required
            />
          </div>

          <!-- Password -->
          <div class="form-group mb-1 position-relative">
            <label for="password" class="mb-2">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Inserisci la tua password"
              required
            />
            <img
              src="/assets/images/eye-icon.png"
              alt="Mostra/Nascondi"
              id="togglePassword"
              class="eye-icon"
            />
          </div>

          <!-- Password dimenticata -->
          <div class="form-group mb-5">
            <a href="#" class="small">Password Dimenticata?</a>
          </div>

          <!-- Messaggio di errore -->
          <p id="loginErrorMessage" class="error-message">
            Errore! E-mail o Password Errata
          </p>

          <!-- Bottone di login -->
          <button type="submit" class="btn btn-primary w-100" id="loginButton">
            Accedi
          </button>
        </form>
      </div>
    </div>

    <!-- NAVBAR -->
    <div id="menu-toggle" style="display: none">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav id="sidebar">
      <ul>
        <li><a href="#" id="homeLink" class="text-white">Home</a></li>
        <li>
          <div class="dropdown w-100">
            <button
              class="btn dropdown-toggle text-white"
              type="button"
              data-bs-toggle="dropdown"
            >
              Timesheet
            </button>
            <ul class="dropdown-menu bg-dark">
              <li>
                <a
                  class="dropdown-item text-white"
                  href="#"
                  id="generateTimesheetBtn"
                  >Genera Timesheet</a
                >
              </li>
              <li>
                <a
                  class="dropdown-item text-white"
                  href="#"
                  id="showAllTimesheetBtn"
                  >Visualizza Timesheet</a
                >
              </li>
            </ul>
          </div>
        </li>
        <li><a href="#" class="text-white">Contatti</a></li>
      </ul>
    </nav>

    <!-- Area Utente -->
    <div id="userMenu" class="dropdown" style="display: block">
      <div class="user-icon" data-bs-toggle="dropdown">
        <div id="profileInitials" class="profile-image"></div>
        <img id="userImage" style="display: none" />
      </div>
      <ul class="dropdown-menu dropdown-menu-end">
        <li class="user-info">
          <div class="user-details">
            <div class="user-img-container">
              <div id="profileInitialsDropdown" class="profile-image"></div>
              <img id="userImageDropdown" class="user-img" />
            </div>
            <span class="user-name" id="userName">Mario Rossi</span>
          </div>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <a class="dropdown-item" href="#" id="userAreaBtn">Area Utente</a>
        </li>
        <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </div>
  </body>
</html>
