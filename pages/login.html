<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- IMPORT BOOTSTRAP -->
    <link
      rel="stylesheet"
      href="/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- IMPORT JQUERY -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- IMPORT BOOTSTRAP POPPERS/CORE -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- IMPORT FILE .CSS-->
    <link rel="stylesheet" href="/css/login.css" />

    <!-- IMPORT FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- IMPORT SCRIPT -->
    <script src="/js/login.js"></script>
    <script src="/js/timesheet.js"></script>

    <!-- Aggiungi la favicon -->
    <link
      rel="icon"
      href="/assets/images/calendar-check-regular.svg"
      type="image/png"
    />

    <!-- Include Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <!-- Loader -->
    <div id="loader">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Caricamento...</span>
      </div>
    </div>

    <!-- Content -->
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
      id="content"
      style="display: none"
    >
      <div id="loader-middle" style="display: none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Caricamento...</span>
        </div>
      </div>
      <div
        class="card p-4"
        style="max-width: 400px; width: 100%; border-radius: 8px"
        id="loginCard"
      >
        <h3 class="mb-4">Log-in</h3>
        <form id="loginForm">
          <!-- Assicurati che il form abbia l'ID "loginForm" -->
          <!-- Username -->
          <div class="form-group mb-4">
            <label for="E-mail" class="mb-2">E-mail</label>
            <input
              type="text"
              class="form-control"
              id="email"
              placeholder="Inserisci l'email"
              required
            />
          </div>

          <!-- Password -->
          <div class="form-group mb-1 position-relative">
            <label for="password" class="mb-2">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Inserisci la tua password"
              required
            />
            <!-- Icona occhio per mostrare/nascondere la password -->
            <img
              src="/assets/images/eye-icon.png"
              alt="Mostra/Nascondi"
              id="eye-icon"
              class="position-absolute"
              style="top: 55%; right: 10px; cursor: pointer"
              onclick="togglePassword()"
            />
          </div>

          <!-- Password dimenticata -->
          <div class="form-group mb-5">
            <a href="#" class="small">Password Dimenticata?</a>
          </div>

          <!-- Bottone di login -->
          <button
            type="submit"
            class="btn btn-primary btn-block w-100"
            id="loginBtn"
          >
            Accedi
          </button>
        </form>
      </div>

      <!-- TIMESHEET CARD -->
      <div class="" id="containerGenerateTimesheet" style="display: none">
        <button
          type="button"
          id="generateTimesheet"
          class="btn btn-primary btn-block w-20"
        >
          Genera Timesheet
        </button>
        <div>
          <label>Seleziona Mese</label>
          <select>
            <option>Gennaio</option>
          </select>
        </div>

        <div>
          <label>Seleziona Anno</label>
          <select>
            <option>2025</option>
          </select>
        </div>
        <div id="tableContainer" class=""></div>
      </div>

      <!-- NAVBAR -->
      <div id="nav-icon" style="display: none">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div id="sidebar">
        <ul>
          <li><a href="#" id="home">Home</a></li>
          <li>
            <div class="dropdown w-100 text-white">
              <button
                class="btn dropdown-toggle text-white"
                type="button"
                data-bs-toggle="dropdown"
                style="border: 0"
              >
                Timesheet
              </button>
              <ul
                class="dropdown-menu"
                style="background-color: #2c3e50; height: 115px"
              >
                <li>
                  <a class="dropdown-item" href="#" id="timesheet"
                    >Genera Timesheet</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="#" id="showTimesheet"
                    >Visualizza Timesheet</a
                  >
                </li>
              </ul>
            </div>
          </li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
